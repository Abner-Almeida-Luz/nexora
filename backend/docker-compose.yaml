version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diversao
      POSTGRES_USER: diversao
      POSTGRES_PASSWORD: diversao123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/diversao
      DB_USERNAME: diversao
      DB_PASSWORD: diversao123
      JWT_SECRET: "cHJvZC1zZWNyZXQta2V5LWZvci1kaXZlcnNhby1lY29tbWVyY2UtMjAyNC1zZWN1cmU="
    ports:
      - "8080:8080"

volumes:
  postgres_data: