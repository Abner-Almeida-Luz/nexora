# Perfil de teste: datasource vem do container Postgres iniciado em
# AbstractIntegrationTest via @DynamicPropertySource. Não há mais H2 aqui.
# Flyway ligado de propósito: assim as próprias migrations são exercitadas
# como teste (é o mesmo SQL que roda em prod).
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: "dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLXB1cnBvc2VzLW9ubHktMjAyNA=="
  expiration: 3600000            # 1h
  refresh-expiration: 2592000000 # 30d